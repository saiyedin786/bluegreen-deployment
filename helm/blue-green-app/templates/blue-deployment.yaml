apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-blue

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: blue-green-app
      version: blue

  template:
    metadata:
      labels:
        app: blue-green-app
        version: blue

    spec:
      containers:
      - name: node-app

        image: "{{ .Values.image.repository }}:{{ .Values.image.blueTag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        env:
        - name: APP_VERSION
          value: BLUE

        ports:
        - containerPort: 3000

        resources:
{{ toYaml .Values.resources | indent 10 }}